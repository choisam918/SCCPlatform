<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="學號抽籤系統">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="theme-color" content="#667eea">
  <meta name="HandheldFriendly" content="true">
  <meta name="MobileOptimized" content="width">
  <title>學號抽籤系統</title>
  <link rel="stylesheet" href="../mobile-stable.css">
  <script src="../mobile-stable.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Noto Sans TC', 'Montserrat', 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: visible;
      display: flex;
      flex-direction: column;
      touch-action: pan-y pinch-zoom;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0.5rem;
      overflow: visible;
    }

    .header {
      text-align: center;
      margin-bottom: 0.5rem;
      flex-shrink: 0;
    }

    .main-title {
      color: #fff;
      font-size: 1.8rem;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .main-title .icon {
      font-size: 1.8rem;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .content-area {
      flex: 1;
      display: flex;
      gap: 0.5rem;
      overflow: hidden;
      min-height: 0;
    }

    .left-panel {
      flex: 0 0 280px;
      background: rgba(255,255,255,0.95);
      border-radius: 0.75rem;
      padding: 1rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .right-panel {
      flex: 1;
      background: rgba(255,255,255,0.95);
      border-radius: 0.75rem;
      padding: 1rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .form-group {
      margin-bottom: 0.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.25rem;
      color: #374151;
      font-weight: 600;
      font-size: 0.8rem;
    }

    .form-control {
      width: 100%;
      padding: 0.5rem;
      border: 2px solid #e5e7eb;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      background: #fff;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-control.textarea {
      resize: vertical;
      min-height: 80px;
      font-family: inherit;
    }

    .mode-section {
      background: rgba(102, 126, 234, 0.05);
      border-radius: 0.5rem;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      border: 2px solid rgba(102, 126, 234, 0.1);
      transition: all 0.3s ease;
    }

    .mode-section.active {
      background: rgba(102, 126, 234, 0.1);
      border-color: rgba(102, 126, 234, 0.3);
      box-shadow: 0 4px 16px rgba(102, 126, 234, 0.15);
    }

    .mode-section h3 {
      margin: 0 0 0.5rem 0;
      color: #4f46e5;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
    }

    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      width: 100%;
      margin-bottom: 0.5rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      color: #374151;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .btn-secondary:hover {
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.25rem;
      margin-bottom: 0.5rem;
    }

    .quick-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.4rem;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
    }

    .quick-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }

    .result-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .result {
      flex: 1;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      border: 2px solid #e2e8f0;
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 0.5rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 150px;
    }

    .result.error {
      color: #ef4444;
      background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
      border-color: #fecaca;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .result-header .icon {
      font-size: 2rem;
      filter: drop-shadow(0 2px 4px rgba(102, 126, 234, 0.3));
    }

    .result-header .title {
      font-size: 1.5rem;
      color: #059669;
      font-weight: 700;
      font-family: 'Montserrat', sans-serif;
    }

    .result-content {
      text-align: center;
      font-size: 1.2rem;
      color: #2563eb;
      font-weight: 600;
      line-height: 1.6;
    }

    .result-numbers {
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdfa 100%);
      border-radius: 1rem;
      padding: 1rem;
      border: 2px solid #60a5fa;
      margin-top: 1rem;
      font-size: 1.3rem;
      color: #2563eb;
      font-weight: 700;
      text-align: center;
    }

    .history-section {
      background: rgba(102, 126, 234, 0.05);
      border-radius: 0.5rem;
      padding: 0.5rem;
      border: 1px solid rgba(102, 126, 234, 0.2);
      max-height: 120px;
      overflow: hidden;
    }

    .history-section h4 {
      margin: 0 0 0.25rem 0;
      color: #4f46e5;
      font-size: 0.8rem;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.25rem;
      margin: 0.125rem 0;
      background: white;
      border-radius: 0.25rem;
      border-left: 2px solid #667eea;
      font-size: 0.7rem;
    }

    .history-item .time {
      color: #6b7280;
      font-size: 0.6rem;
    }

    /* 動畫效果 */
    @keyframes roll {
      0% { transform: translateY(0); opacity: 1; }
      50% { transform: translateY(-20px); opacity: 0.5; }
      100% { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .rolling {
      animation: roll 0.5s ease-in-out;
    }

    .result.show {
      animation: fadeInUp 0.6s ease-out;
    }

    .result-numbers .highlight {
      animation: pulse 0.8s ease-in-out;
      color: #dc2626;
      font-weight: 900;
    }

    /* 響應式設計 */
    @media (max-width: 768px) {
      .content-area {
        flex-direction: column;
      }

      .left-panel {
        flex: 0 0 auto;
        max-height: none; /* 移除高度限制，让内容完整显示 */
        overflow-y: auto; /* 如果内容过多，允许滚动 */
      }

      .main-title {
        font-size: 1.5rem;
      }

      .main-title .icon {
        font-size: 1.5rem;
      }

      .quick-actions {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .main-container {
        padding: 0.25rem;
      }

      .left-panel,
      .right-panel {
        padding: 0.5rem;
        margin-bottom: 0.5rem; /* 增加面板间距 */
      }

      .main-title {
        font-size: 1.2rem;
      }

      .main-title .icon {
        font-size: 1.2rem;
      }

      .quick-actions {
        grid-template-columns: 1fr;
      }

      /* 优化表单元素在小屏幕上的显示 */
      .form-group {
        margin-bottom: 0.75rem; /* 增加表单项间距 */
      }

      .form-group label {
        font-size: 0.9rem; /* 稍微减小标签字体 */
        margin-bottom: 0.25rem;
      }

      .form-group input,
      .form-group select {
        padding: 0.5rem; /* 确保输入框有足够的内边距 */
        font-size: 0.9rem;
      }

      /* 确保按钮有足够的点击区域 */
      .btn {
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
        min-height: 44px; /* 确保按钮高度符合移动端标准 */
      }
    }

    /* 超小屏幕优化 (320px以下) */
    @media (max-width: 320px) {
      .main-container {
        padding: 0.1rem;
      }

      .left-panel,
      .right-panel {
        padding: 0.25rem;
        margin-bottom: 0.25rem;
      }

      .main-title {
        font-size: 1rem;
      }

      .form-group {
        margin-bottom: 0.5rem;
      }

      .form-group label {
        font-size: 0.8rem;
      }

      .form-group input,
      .form-group select {
        padding: 0.4rem;
        font-size: 0.8rem;
      }

      .btn {
        padding: 0.6rem 0.8rem;
        font-size: 0.8rem;
        min-height: 40px;
      }
    }

  </style>
</head>
<body>
  <div class="main-container">
    <div class="header">
      <h1 class="main-title">
        <span class="icon">🎲</span>
        學號抽籤系統
      </h1>
    </div>

    <div class="content-area">
      <!-- 左側控制面板 -->
      <div class="left-panel">
        <!-- 模式選擇 -->
        <div class="form-group">
          <label for="mainMode">選擇抽籤模式：</label>
          <select id="mainMode" class="form-control" onchange="toggleMainMode()">
            <option value="number">按人數抽籤</option>
            <option value="name">按姓名抽籤</option>
          </select>
        </div>

        <!-- 按人數抽籤區域 -->
        <div id="numberModeSection" class="mode-section active">
          <h3>
            <span>🔢</span>按人數抽籤
          </h3>
          <div class="form-group">
            <label for="total">總人數（學號從 1 開始）：</label>
            <input type="number" id="total" class="form-control" min="1" max="999" value="30">
          </div>
          <div class="form-group">
            <label for="drawCount">抽取人數：</label>
            <input type="number" id="drawCount" class="form-control" min="1" value="1">
          </div>
          <div class="form-group">
            <label for="numberMode">抽取模式：</label>
            <select id="numberMode" class="form-control">
              <option value="all">全部學號</option>
              <option value="odd">只抽奇數學號</option>
              <option value="even">只抽偶數學號</option>
            </select>
          </div>
        </div>

        <!-- 按姓名抽籤區域 -->
        <div id="nameModeSection" class="mode-section" style="display: none;">
          <h3>
            <span>👥</span>按姓名抽籤
          </h3>
          <div class="form-group">
            <label for="names">輸入姓名（每行一個）：</label>
            <textarea id="names" class="form-control textarea" rows="4" placeholder="例如：&#10;張三&#10;李四&#10;王五&#10;趙六"></textarea>
          </div>
          
          <div class="form-group">
            <label for="nameDrawMode">抽籤模式：</label>
            <select id="nameDrawMode" class="form-control" onchange="toggleNameDrawOptions()">
              <option value="group">分組模式</option>
              <option value="oneByOne">逐一抽籤</option>
              <option value="auto">自動抽籤</option>
            </select>
          </div>
          
          <!-- 分組模式選項 -->
          <div id="groupOptions" class="form-group">
            <label for="groupCount">分組數量：</label>
            <input type="number" id="groupCount" class="form-control" min="2" max="10" value="2">
          </div>
          
          <!-- 自動抽籤選項 -->
          <div id="autoOptions" class="form-group" style="display: none;">
            <label for="autoDrawCount">抽取人數：</label>
            <input type="number" id="autoDrawCount" class="form-control" min="1" value="1">
          </div>
          
          <!-- 逐一抽籤選項 -->
          <div id="oneByOneOptions" class="form-group" style="display: none;">
            <label for="oneByOneGroupCount">分組數量：</label>
            <input type="number" id="oneByOneGroupCount" class="form-control" min="2" max="10" value="2">
          </div>
        </div>

        <!-- 抽籤按鈕 -->
        <button class="btn" onclick="drawLot()">🎯 抽籤！</button>

        <!-- 快捷操作 -->
        <div class="quick-actions">
          <button class="quick-btn" onclick="quickDraw(1)">快速抽1人</button>
          <button class="quick-btn" onclick="quickDraw(5)">快速抽5人</button>
          <button class="quick-btn" onclick="quickDraw(10)">快速抽10人</button>
        </div>
      </div>

      <!-- 右側結果面板 -->
      <div class="right-panel">
        <div class="result-area">
          <div class="result" id="result">
            <div style="text-align: center; color: #6b7280; font-size: 0.9rem;">
              <div style="font-size: 2rem; margin-bottom: 0.5rem;">🎲</div>
              <div>點擊「抽籤！」開始抽籤</div>
            </div>
          </div>

          <!-- 歷史記錄 -->
          <div id="historySection" class="history-section" style="display: none;">
            <h4>抽籤歷史</h4>
            <div id="historyList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 全局變數
    let drawHistory = [];

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function drawLot() {
      const mainMode = document.getElementById('mainMode').value;
      const resultDiv = document.getElementById('result');
      resultDiv.className = 'result';
      
      // 添加抽籤動畫
      resultDiv.classList.add('rolling');
      setTimeout(() => {
        resultDiv.classList.remove('rolling');
        resultDiv.classList.add('show');
      }, 500);
      
      if (mainMode === 'name') {
        // 姓名抽籤模式
        const namesText = document.getElementById('names').value.trim();
        const names = namesText.split('\n').map(name => name.trim()).filter(name => name !== '');
        if (names.length === 0) {
          resultDiv.innerHTML = '<div class="result error">請輸入有效的姓名！</div>';
          return;
        }
        
        const nameDrawMode = document.getElementById('nameDrawMode').value;
        
        if (nameDrawMode === 'group') {
          // 分組模式
          const groupCount = parseInt(document.getElementById('groupCount').value, 10);
          if (isNaN(groupCount) || groupCount < 2 || groupCount > 10) {
            resultDiv.innerHTML = '<div class="result error">請輸入 2 ~ 10 之間的分組數量！</div>';
            return;
          }
          
          // 洗牌姓名
          const shuffledNames = [...names];
          for (let i = shuffledNames.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledNames[i], shuffledNames[j]] = [shuffledNames[j], shuffledNames[i]];
          }
          
          // 分組
          const groups = [];
          const namesPerGroup = Math.ceil(shuffledNames.length / groupCount);
          for (let i = 0; i < groupCount; i++) {
            const start = i * namesPerGroup;
            const end = Math.min((i + 1) * namesPerGroup, shuffledNames.length);
            if (start < shuffledNames.length) {
              groups.push(shuffledNames.slice(start, end));
            }
          }
          
          // 顯示分組結果
          let groupsHtml = '';
          groups.forEach((group, index) => {
            groupsHtml += `<div style="margin-bottom: 1rem; padding: 1rem; background: rgba(96, 165, 250, 0.1); border-radius: 0.75rem; border-left: 4px solid #60a5fa;">
              <strong style="color: #1e40af; font-size: 1.1em;">第 ${index + 1} 組：</strong><br>
              <span style="color: #2563eb; font-size: 1.05em;">${group.map(escapeHtml).join('、')}</span>
            </div>`;
          });
          
          resultDiv.innerHTML = `
            <div class='result-header'>
              <span class='icon'>👥</span>
              <span class='title'>分組結果</span>
            </div>
            <div class='result-numbers' style="width: 100%; max-width: none;">
              ${groupsHtml}
            </div>
          `;
          
          // 保存歷史記錄
          const groupSummary = groups.map((group, index) => `第${index + 1}組: ${group.join('、')}`).join('; ');
          saveHistory(`分組結果: ${groupSummary}`, '按姓名分組');
          
        } else if (nameDrawMode === 'oneByOne') {
          // 逐一抽籤模式
          const groupCount = parseInt(document.getElementById('oneByOneGroupCount').value, 10);
          if (isNaN(groupCount) || groupCount < 2 || groupCount > 10) {
            resultDiv.innerHTML = '<div class="result error">請輸入 2 ~ 10 之間的分組數量！</div>';
            return;
          }
          
          if (!window.remainingNames || window.remainingNames.length === 0) {
            // 初始化或重新開始
            window.remainingNames = [...names];
            window.groups = Array.from({length: groupCount}, () => []);
            // 洗牌
            for (let i = window.remainingNames.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [window.remainingNames[i], window.remainingNames[j]] = [window.remainingNames[j], window.remainingNames[i]];
            }
          }
          
          // 抽取一個人
          const selected = window.remainingNames.pop();
          
          // 分配到組別（輪流分配）
          const currentGroupIndex = (names.length - window.remainingNames.length - 1) % groupCount;
          window.groups[currentGroupIndex].push(selected);
          
          // 顯示結果
          let groupsHtml = '';
          window.groups.forEach((group, index) => {
            if (group.length > 0) {
              groupsHtml += `<div style="margin-bottom: 0.5rem; padding: 0.75rem; background: rgba(96, 165, 250, 0.1); border-radius: 0.5rem; border-left: 3px solid #60a5fa;">
                <strong style="color: #1e40af; font-size: 0.9em;">第 ${index + 1} 組：</strong>
                <span style="color: #2563eb; font-size: 0.85em;"> ${group.map(escapeHtml).join('、')}</span>
              </div>`;
            }
          });
          
          resultDiv.innerHTML = `
            <div class='result-header'>
              <span class='icon'>🎯</span>
              <span class='title'>抽中姓名</span>
            </div>
            <div class='result-numbers'>
              <div style="font-size: 2.5em; margin: 1rem 0; color: #dc2626; font-weight: 900;">${escapeHtml(selected)}</div>
              <div style="margin-top: 1rem; text-align: center; color: #059669; font-size: 1.1em; font-weight: bold;">
                分配到第 ${currentGroupIndex + 1} 組
              </div>
            </div>
            <div style="margin-top: 1rem; text-align: center; color: #6b7280; font-size: 0.9em;">
              剩餘 ${window.remainingNames.length} 人
            </div>
            ${groupsHtml ? `
              <div style="margin-top: 1rem;">
                <div style="text-align: center; color: #374151; font-size: 1em; font-weight: bold; margin-bottom: 0.5rem;">當前分組狀況</div>
                <div style="max-height: 150px; overflow-y: auto;">
                  ${groupsHtml}
                </div>
              </div>
            ` : ''}
            ${window.remainingNames.length === 0 ? 
              '<div style="margin-top: 1rem;"><button onclick="resetOneByOne()" class="btn btn-secondary">🔄 重新開始</button></div>' 
              : ''
            }
          `;
          
          // 保存歷史記錄
          saveHistory(`抽中: ${selected} (分配到第${currentGroupIndex + 1}組)`, '按姓名逐一抽籤');
          
        } else if (nameDrawMode === 'auto') {
          // 自動抽籤模式
          const autoDrawCount = parseInt(document.getElementById('autoDrawCount').value, 10);
          if (isNaN(autoDrawCount) || autoDrawCount < 1 || autoDrawCount > names.length) {
            resultDiv.innerHTML = `<div class="result error">請輸入 1 ~ ${names.length} 之間的抽取人數！</div>`;
            return;
          }
          
          // 洗牌姓名
          const shuffledNames = [...names];
          for (let i = shuffledNames.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledNames[i], shuffledNames[j]] = [shuffledNames[j], shuffledNames[i]];
          }
          
          // 抽取指定人數
          const selected = shuffledNames.slice(0, autoDrawCount);
          
          // 顯示結果
          let selectedHtml = '';
          for (let i = 0; i < selected.length; i += 3) {
            selectedHtml += `<div style="margin-bottom: 0.5rem;">${selected.slice(i, i+3).map(escapeHtml).join('、')}</div>`;
          }
          
          resultDiv.innerHTML = `
            <div class='result-header'>
              <span class='icon'>🎉</span>
              <span class='title'>抽中姓名</span>
            </div>
            <div class='result-numbers'>
              ${selectedHtml}
            </div>
          `;
          
          // 保存歷史記錄
          saveHistory(`抽中姓名: ${selected.join('、')}`, '按姓名自動抽籤');
        }
        
        resultDiv.classList.remove('error');
        
        // 播放音效
        try {
          playSound();
        } catch (e) {
          // 音效播放失敗時靜默處理
        }
      } else {
        // 學號抽籤模式
        const total = parseInt(document.getElementById('total').value, 10);
        const drawCount = parseInt(document.getElementById('drawCount').value, 10);
        const numberMode = document.getElementById('numberMode').value;
        
        if (isNaN(total) || total < 1) {
          resultDiv.innerHTML = '<div class="result error">請輸入有效的總人數！</div>';
          return;
        }
        
        let pool = [];
        for (let i = 1; i <= total; i++) {
          if (numberMode === 'odd' && i % 2 === 0) continue;
          if (numberMode === 'even' && i % 2 !== 0) continue;
          pool.push(i);
        }
        
        if (pool.length === 0) {
          resultDiv.innerHTML = '<div class="result error">沒有可抽取的學號！</div>';
          return;
        }
        if (isNaN(drawCount) || drawCount < 1 || drawCount > pool.length) {
          resultDiv.innerHTML = `<div class="result error">請輸入 1 ~ ${pool.length} 之間的抽取人數！</div>`;
          return;
        }
        
        // 洗牌
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        const selected = pool.slice(0, drawCount);
        
        // 每行最多5個，行數不限
        let numbersHtml = '';
        for (let i = 0; i < selected.length; i += 5) {
          numbersHtml += `<div style="margin-bottom: 0.5rem;">${selected.slice(i, i+5).join(', ')}</div>`;
        }
        resultDiv.innerHTML = `
          <div class='result-header'>
            <span class='icon'>🎉</span>
            <span class='title'>抽中學號</span>
          </div>
          <div class='result-numbers'>${numbersHtml}</div>
        `;
        resultDiv.classList.remove('error');
        
        // 保存歷史記錄
        saveHistory(`抽中學號: ${selected.join(', ')}`, '按人數抽籤');
        
        // 播放音效
        try {
          playSound();
        } catch (e) {
          // 音效播放失敗時靜默處理
        }
      }
    }

    function toggleMainMode() {
      const numberModeSection = document.getElementById('numberModeSection');
      const nameModeSection = document.getElementById('nameModeSection');
      const mainModeSelect = document.getElementById('mainMode');
      const isNameMode = mainModeSelect.value === 'name';
      
      if (isNameMode) {
        numberModeSection.style.display = 'none';
        numberModeSection.classList.remove('active');
        nameModeSection.style.display = 'block';
        nameModeSection.classList.add('active');
      } else {
        numberModeSection.style.display = 'block';
        numberModeSection.classList.add('active');
        nameModeSection.style.display = 'none';
        nameModeSection.classList.remove('active');
      }
      
      // 清空結果區域
      document.getElementById('result').innerHTML = '<div style="text-align: center; color: #6b7280; font-size: 0.9rem;"><div style="font-size: 2rem; margin-bottom: 0.5rem;">🎲</div><div>點擊「抽籤！」開始抽籤</div></div>';
    }

    function toggleNameDrawOptions() {
      const nameDrawMode = document.getElementById('nameDrawMode').value;
      const groupOptions = document.getElementById('groupOptions');
      const autoOptions = document.getElementById('autoOptions');
      const oneByOneOptions = document.getElementById('oneByOneOptions');
      
      // 隱藏所有選項
      groupOptions.style.display = 'none';
      autoOptions.style.display = 'none';
      oneByOneOptions.style.display = 'none';
      
      // 根據選擇的模式顯示對應選項
      if (nameDrawMode === 'group') {
        groupOptions.style.display = 'block';
      } else if (nameDrawMode === 'auto') {
        autoOptions.style.display = 'block';
      } else if (nameDrawMode === 'oneByOne') {
        oneByOneOptions.style.display = 'block';
      }
    }

    // 頁面載入時初始化
    window.onload = function() {
      toggleMainMode();
    }

    function resetOneByOne() {
      window.remainingNames = null;
      window.groups = null;
      document.getElementById('result').innerHTML = '<div style="text-align: center; color: #6b7280; font-size: 0.9rem;"><div style="font-size: 2rem; margin-bottom: 0.5rem;">🎲</div><div>點擊「抽籤！」開始抽籤</div></div>';
    }
    
    // 快捷抽籤功能
    function quickDraw(count) {
      const mainMode = document.getElementById('mainMode').value;
      
      if (mainMode === 'number') {
        document.getElementById('drawCount').value = count;
      } else if (mainMode === 'name') {
        document.getElementById('nameDrawMode').value = 'auto';
        document.getElementById('autoDrawCount').value = count;
        toggleNameDrawOptions();
      }
      
      drawLot();
    }
    
    // 保存歷史記錄
    function saveHistory(result, mode) {
      const historyItem = {
        time: new Date().toLocaleString('zh-TW'),
        result: result,
        mode: mode
      };
      
      drawHistory.unshift(historyItem);
      if (drawHistory.length > 10) {
        drawHistory.pop(); // 只保留最近10筆
      }
      
      updateHistoryDisplay();
    }
    
    // 更新歷史記錄顯示
    function updateHistoryDisplay() {
      const historySection = document.getElementById('historySection');
      const historyList = document.getElementById('historyList');
      
      if (drawHistory.length > 0) {
        historySection.style.display = 'block';
        historyList.innerHTML = drawHistory.map(item => `
          <div class="history-item">
            <span>${escapeHtml(item.result)}</span>
            <span class="time">${escapeHtml(item.time)}</span>
          </div>
        `).join('');
      } else {
        historySection.style.display = 'none';
      }
    }
    
    // 清空歷史記錄
    function clearHistory() {
      drawHistory = [];
      updateHistoryDisplay();
    }
    
    // 匯出結果
    function exportResult() {
      const resultDiv = document.getElementById('result');
      if (resultDiv.innerHTML.trim() === '') {
        alert('沒有可匯出的結果！');
        return;
      }
      
      const resultText = resultDiv.innerText;
      const blob = new Blob([resultText], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `抽籤結果_${new Date().toLocaleDateString('zh-TW')}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }
    
    // 添加音效（可選）
    function playSound() {
      // 簡單的音效實現
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
      oscillator.frequency.setValueAtTime(600, audioContext.currentTime + 0.1);
      
      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
      
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.2);
    }
  </script>
</body>
